# Hub namespaces.
# - clusters: holds HostedCluster, NodePool and NodePool config ConfigMaps.
#   HyperShift creates the control plane namespace "clusters-hcp-luks" itself.
# - <AGENT_NAMESPACE> (pre-existing, not managed here; create it if needed): holds InfraEnv, NMStateConfig,
#   Agents and the worker VM.
apiVersion: v1
kind: Namespace
metadata:
  name: clusters
