# Replace placeholders before applying.
# Pull secret is needed twice: once for the HostedCluster (ns clusters),
# once for the InfraEnv (ns hcp-luks-agents).
apiVersion: v1
kind: Secret
metadata:
  name: hcp-luks-pull-secret
  namespace: clusters
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '<PULL_SECRET_JSON>'
---
apiVersion: v1
kind: Secret
metadata:
  name: hcp-luks-ssh-key
  namespace: clusters
type: Opaque
stringData:
  id_rsa.pub: '<SSH_PUBLIC_KEY>'
---
apiVersion: v1
kind: Secret
metadata:
  name: hcp-luks-pull-secret
  namespace: hcp-luks-agents
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '<PULL_SECRET_JSON>'
