# Discovery ISO source for worker hosts.
# agentLabels are stamped on every Agent registering through this InfraEnv,
# so the NodePool agentLabelSelector only picks hosts booted from it.
# Only boot hosts with TPM 2.0 enabled in firmware from this ISO.
apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  name: hcp-luks
  namespace: <AGENT_NAMESPACE>
spec:
  pullSecretRef:
    name: hcp-luks-pull-secret
  sshAuthorizedKey: '<SSH_PUBLIC_KEY>'
  cpuArchitecture: x86_64
  # Discovery image only: console password for user core (debug when the
  # host is unreachable, e.g. wrong static IP). Changing it regenerates the ISO.
  # The installed node gets its password from 21-nodepool-config-core-password.yaml.
  ignitionConfigOverride: '{"ignition":{"version":"3.1.0"},"passwd":{"users":[{"name":"core","passwordHash":"<CORE_PASSWORD_HASH>"}]}}'
  agentLabels:
    hcp-luks.example.com/tpm2: "true"
  # Static IPv4: embeds every matching NMStateConfig (03-nmstateconfig.yaml)
  nmStateConfigLabelSelector:
    matchLabels:
      infraenvs.agent-install.openshift.io: hcp-luks
