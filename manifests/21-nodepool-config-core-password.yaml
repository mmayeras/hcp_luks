# NodePool config: sets a password for the "core" user (console / BMC
# serial login, useful when SSH or network is down). Only "core" is supported
# by MCO. Equivalent Butane source: butane/worker-core-password.bu
#
# Replace <CORE_PASSWORD_HASH> with a SHA-512 crypt hash:
#   openssl passwd -6
# Changing it later changes the NodePool config hash: with upgradeType
# Replace, that reprovisions every node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hcp-luks-worker-core-password
  namespace: clusters
data:
  config: |
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      name: 99-worker-core-password
      labels:
        machineconfiguration.openshift.io/role: worker
    spec:
      config:
        ignition:
          version: 3.4.0
        passwd:
          users:
            - name: core
              passwordHash: '<CORE_PASSWORD_HASH>'
